version: '3.8'

services:
  # ==========================================================================
  # 1. BASE DE DATOS POSTGRESQL 16
  # ==========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dc_procesos_db}
      POSTGRES_USER: ${POSTGRES_USER:-dc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dc_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dc_procesos_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dc_admin} -d ${POSTGRES_DB:-dc_procesos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dc_procesos_net

  # ==========================================================================
  # 2. BACKEND API REST (NODE.JS / EXPRESS)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dc_procesos_db}
      POSTGRES_USER: ${POSTGRES_USER:-dc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dc_secure_password_2026}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - dc_procesos_net

  # ==========================================================================
  # 3. FRONTEND WEB & PROXY NGINX (procesos.dcasesoriaslatam.com)
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - dc_procesos_net

volumes:
  dc_procesos_pgdata:
    driver: local

networks:
  dc_procesos_net:
    driver: bridge
