<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="dcBgSolid" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#082a1c" />
      <stop offset="60%" stop-color="#03150e" />
      <stop offset="100%" stop-color="#010c08" />
    </radialGradient>
  </defs>

  <!-- Fondo circular con fondo sólido garantizado y borde esmeralda -->
  <circle cx="256" cy="256" r="246" fill="#021810" stroke="#00df82" stroke-width="4" />
  <circle cx="256" cy="256" r="246" fill="url(#dcBgSolid)" opacity="0.8" />
  <circle cx="256" cy="256" r="234" fill="none" stroke="#00df82" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.45" />

  <!-- Cabezal digital de pesaje arriba -->
  <rect x="196" y="75" width="120" height="42" rx="10" fill="#021a12" stroke="#00df82" stroke-width="3" />
  <circle cx="216" cy="96" r="6" fill="#00ff96" />
  <rect x="232" y="90" width="68" height="12" rx="4" fill="#00df82" opacity="0.9" />
  <line x1="256" y1="117" x2="256" y2="150" stroke="#00df82" stroke-width="6" stroke-linecap="round" />

  <!-- LETRA D (Blanco Puro) -->
  <path
    d="M 145 155 L 210 155 C 260 155, 275 185, 275 220 C 275 255, 260 285, 210 285 L 145 285 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- LETRA C (Verde Esmeralda Neón) -->
  <path
    d="M 342 165 A 64 64 0 1 0 342 275"
    fill="none"
    stroke="#00df82"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- PLATAFORMA DE PESAJE EN ACERO INOXIDABLE -->
  <rect x="110" y="295" width="292" height="20" rx="5" fill="#94a3b8" stroke="#ffffff" stroke-width="2" />
  <rect x="116" y="298" width="280" height="4" rx="2" fill="#ffffff" opacity="0.95" />
  
  <!-- Patas celda de carga -->
  <rect x="135" y="315" width="30" height="10" rx="3" fill="#334155" />
  <rect x="347" y="315" width="30" height="10" rx="3" fill="#334155" />

  <!-- TIPOGRAFÍA GRANDE Y LEGIBLE -->
  <text
    x="256"
    y="385"
    text-anchor="middle"
    fill="#ffffff"
    font-size="52"
    font-weight="900"
    letter-spacing="4"
    font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  >
    DC PROCESOS
  </text>

  <text
    x="256"
    y="428"
    text-anchor="middle"
    fill="#00df82"
    font-size="24"
    font-weight="800"
    letter-spacing="3"
    font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  >
    PESAJE &amp; RENDIMIENTOS
  </text>
</svg>
