<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#082d22" />
      <stop offset="60%" stop-color="#031a13" />
      <stop offset="100%" stop-color="#010c09" />
    </radialGradient>

    <linearGradient id="dcSteelPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Fondo Completo Oscuro (Edge-to-Edge para llenar el icono del celular sin borde blanco) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Anillo decorativo exterior a juego con DC Enrutador y DC Restaurantes -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#083829" stroke-width="4" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#00df82" stroke-width="2" stroke-dasharray="8 6" opacity="0.35" />

  <!-- NÚCLEO COMPACTO Y CENTRADO: BÁSCULA + MONOGRAMA DC (100% VISIBLE EN SPLASH SCREEN) -->
  
  <!-- Mástil vertical de la báscula -->
  <line x1="256" y1="140" x2="256" y2="280" stroke="#00df82" stroke-width="6" stroke-linecap="round" />
  
  <!-- Cabezal digital de pesaje -->
  <rect x="200" y="98" width="112" height="46" rx="10" fill="#0b1727" stroke="#00df82" stroke-width="2.5" />
  <circle cx="215" cy="121" r="4" fill="#00df82" />
  <text x="263" y="130" fill="#00df82" font-size="20" font-weight="900" text-anchor="middle" font-family="monospace">
    0.00 kg
  </text>

  <!-- LETRA D (Blanco Puro Sólido - 100% Visible) -->
  <path
    d="M 145 174 L 210 174 C 245 174, 258 196, 258 228 C 258 260, 245 282, 210 282 L 145 282 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="22"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- LETRA C (Verde Esmeralda Brillante - 100% Visible) -->
  <path
    d="M 360 184 C 325 158, 275 170, 250 200 C 225 230, 225 264, 250 294 C 275 322, 325 324, 360 300"
    fill="none"
    stroke="#00df82"
    stroke-width="22"
    stroke-linecap="round"
  />

  <!-- PLATAFORMA DE PESAJE EN ACERO INOXIDABLE -->
  <rect x="116" y="280" width="280" height="17" rx="4" fill="url(#dcSteelPlate)" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="122" y1="284" x2="390" y2="284" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  
  <!-- Soportes de celda de carga -->
  <rect x="136" y="297" width="32" height="9" rx="2" fill="#334155" />
  <rect x="344" y="297" width="32" height="9" rx="2" fill="#334155" />

  <!-- NOMBRE OFICIAL DE LA APLICACIÓN (Situado en la zona segura del Splash Screen Android) -->
  <text x="256" y="358" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="900" font-family="Arial, 'Segoe UI', sans-serif" letter-spacing="5">
    DC PROCESOS
  </text>
  <text x="256" y="394" text-anchor="middle" fill="#00df82" font-size="18" font-weight="800" font-family="Arial, 'Segoe UI', sans-serif" letter-spacing="3.5">
    DC ASESORÍAS
  </text>
</svg>