<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="p2Bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1b15" />
      <stop offset="70%" stop-color="#03110c" />
      <stop offset="100%" stop-color="#010705" />
    </radialGradient>
    <linearGradient id="p2Steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="p2Green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="p2Glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Continuo Edge-to-Edge para evitar marcos en la app movil -->
  <rect width="512" height="512" fill="url(#p2Bg)" />

  <!-- Corona circular de balance de masa -->
  <circle cx="256" cy="225" r="160" fill="none" stroke="#00df82" stroke-width="2" opacity="0.25" stroke-dasharray="10 12" />

  <!-- Indicador digital estilizado arriba (Cabezal LED) -->
  <rect x="206" y="90" width="100" height="34" rx="8" fill="#041f17" stroke="#00df82" stroke-width="2" />
  <circle cx="222" cy="107" r="4" fill="#00df82" filter="url(#p2Glow)" />
  <rect x="236" y="102" width="56" height="10" rx="3" fill="#00df82" opacity="0.85" />
  <line x1="256" y1="124" x2="256" y2="150" stroke="#00df82" stroke-width="4" stroke-linecap="round" />

  <!-- MONOGRAMA DC FLOTANTE Y PROTAGONISTA -->
  <!-- D -->
  <path d="M 165 160 L 220 160 C 255 160, 270 185, 270 215 C 270 245, 255 270, 220 270 L 165 270 Z" 
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- C -->
  <path d="M 335 175 C 300 150, 250 160, 230 195 C 210 230, 220 260, 250 280 C 285 298, 325 290, 340 270" 
        fill="none" stroke="url(#p2Green)" stroke-width="24" stroke-linecap="round" />

  <!-- PLATAFORMA DE PESAJE DE ALTA PRECISIÓN (Base en Acero Inoxidable) -->
  <rect x="120" y="278" width="272" height="16" rx="5" fill="url(#p2Steel)" />
  <rect x="126" y="281" width="260" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
  
  <!-- Patas de celda de carga -->
  <rect x="145" y="294" width="24" height="8" rx="2" fill="#334155" />
  <rect x="343" y="294" width="24" height="8" rx="2" fill="#334155" />

  <!-- Textos de Marca -->
  <text x="256" y="365" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="900" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="6">
    DC PROCESOS
  </text>
  <text x="256" y="400" text-anchor="middle" fill="#00df82" font-size="15" font-weight="800" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="4">
    PESAJE &amp; RENDIMIENTOS
  </text>
</svg>
