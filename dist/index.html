    <!-- Capturador de Emergencia Global para Diagnóstico en Pantalla -->
    <script>
      window.addEventListener('error', function(event) {
        console.error('GLOBAL_WINDOW_ERROR:', event);
        var root = document.getElementById('root');
        if (!root || !root.children || root.children.length === 0) {
          var container = document.getElementById('fatal-error-panel');
          if (!container) {
            container = document.createElement('div');
            container.id = 'fatal-error-panel';
            container.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#f0f7ff;padding:24px;font-family:sans-serif;z-index:999999;display:flex;align-items:center;justify-content:center;';
            document.body ? document.body.appendChild(container) : document.documentElement.appendChild(container);
          }
          container.innerHTML = '<div style="background:#fff;border:1px solid #fecaca;padding:24px;border-radius:16px;max-width:550px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,0.05);">' +
            '<div style="color:#dc2626;font-size:18px;font-weight:bold;margin-bottom:8px;">⚠️ Error de Carga en DC Procesos</div>' +
            '<p style="color:#64748b;font-size:13px;margin-bottom:12px;">Se presentó un error en el navegador:</p>' +
            '<pre style="background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px;font-size:11px;overflow:auto;max-height:200px;white-space:pre-wrap;">' +
            (event.error ? (event.error.stack || event.error.message || String(event.error)) : event.message) + '</pre>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}window.location.reload(true);" style="margin-top:14px;background:#4338ca;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;font-size:12px;cursor:pointer;">Limpiar Caché y Recargar</button>' +
            '</div>';
        }
      });
    </script>
